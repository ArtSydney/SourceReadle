<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SourceReadle</title>
  <meta name="description" content="A daily code-reading puzzle: find the vulnerability, name its class, pick the fix." />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <header class="topbar">
    <button id="helpBtn" class="help" title="How to play" aria-label="How to play">?</button>
    <div class="brand">
      <span class="logo">&lt;/&gt;</span>
      <h1>SourceReadle</h1>
    </div>
    <div class="streak" id="streak" title="Current / max streak">🔥 0</div>
  </header>

  <nav class="controls">
    <div class="datenav">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <span id="dateLabel">—</span>
      <button id="nextDay" aria-label="Next day">›</button>
    </div>
    <div class="difftabs" id="difftabs" role="tablist" aria-label="Difficulty">
      <button data-diff="intro" role="tab">Intro</button>
      <button data-diff="easy" role="tab">Easy</button>
      <button data-diff="medium" role="tab">Medium</button>
      <button data-diff="hard" role="tab">Hard</button>
    </div>
    <div class="modes">
      <select id="langSelect" class="lang" title="Filter by language" aria-label="Filter by language"></select>
      <button id="explainBtn" class="toggle" aria-pressed="false" title="Tap any line to see what it does">Explain</button>
      <button id="learnBtn" class="toggle" aria-pressed="false" title="Unlimited guesses + hints, no streak">Learn</button>
    </div>
  </nav>

  <main id="main">
    <section class="meta" id="meta"></section>

    <section class="code" id="codePanel" aria-label="Source code"></section>

    <section class="note hidden" id="notePanel" aria-live="polite"></section>

    <section class="stage" id="stagePanel"></section>

    <section class="result hidden" id="resultPanel"></section>
  </main>

  <footer class="foot">
    <span>Read code. Find the bug. Learn the fix.</span>
    <a id="reportLink" href="#" target="_blank" rel="noopener">Report this puzzle</a>
  </footer>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div class="tut hidden" id="report" role="dialog" aria-modal="true" aria-label="Report this puzzle">
    <div class="tut-card report-card">
      <button class="tut-skip" id="reportClose" aria-label="Close">✕</button>
      <h3 class="report-title">Report this puzzle</h3>
      <p class="report-sub">What felt off? This opens a prefilled GitHub issue — nothing is sent automatically.</p>
      <div class="report-field">
        <label>Which part seemed wrong?</label>
        <div class="report-chips" id="reportStages"></div>
      </div>
      <div class="report-field">
        <label for="reportText">Details (optional)</label>
        <textarea id="reportText" rows="4" placeholder="e.g. the marked fix doesn't actually close the bug, or the line should be 7 not 6…"></textarea>
      </div>
      <p class="report-ctx" id="reportCtx"></p>
      <div class="tut-nav report-nav">
        <button class="btn secondary" id="reportCancel">Cancel</button>
        <button class="btn" id="reportSubmit">Open GitHub issue ↗</button>
      </div>
    </div>
  </div>

  <div class="tut hidden" id="tutorial" role="dialog" aria-modal="true" aria-label="How to play">
    <div class="tut-card">
      <button class="tut-skip" id="tutSkip">Skip</button>
      <div class="tut-body" id="tutBody"></div>
      <div class="tut-nav">
        <button class="btn secondary" id="tutBack">Back</button>
        <div class="tut-dots" id="tutDots"></div>
        <button class="btn" id="tutNext">Next</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
